[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "human_body_prior"
version = "2.3.0"
description = "Variational human pose prior for synthesis and estimation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Nima Ghorbani", email = "nghorbani@tue.mpg.de" }]
urls = { Homepage = "https://github.com/nghorbani/human_body_prior" }
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "torch>=2.6.0",
  "torchvision",
  "torchaudio",
  "omegaconf",
  "loguru",
  "tqdm",
  "PyYAML",
  "transforms3d>=0.4.1,<0.5",
  "scipy>=1.16.3",
  "smplx>=0.1.28",
  "colour>=0.1.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
# Cross-platform support: CUDA on Linux/Windows, CPU on macOS
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[project.optional-dependencies]
pl = ["lightning>=2.4,<2.5"]
vis = ["trimesh>=4,<5"]
# Use the canonical package name from metadata to avoid uv parse errors
psbody = ["psbody-mesh @ git+https://github.com/MPI-IS/mesh.git"]
dev = ["pytest>=7.4,<9"]

[tool.hatch.build]
include = [
  "+human_body_prior/**",
  "+support_data/**",
  "+README.md",
  "+LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["human_body_prior"]

[tool.hatch.metadata]
allow-direct-references = true
